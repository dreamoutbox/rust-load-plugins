[package]
name = "rust-load-so"
version = "0.1.0"
edition = "2024"

[dependencies]
# Native .so/.dll runtime loading.
libloading = "0.8"

# WASM runtime — wasmtime (AOT-compiled, production grade).
wasmtime = "49"

# WASM runtime — wasmer (alternative, JIT-based).
wasmer = { version = "7.5.0-rc.1", default-features = false, features = [
    "sys-default",
] }

# Lua 5.4 scripting (links liblua statically).
mlua = { version = "0.12", features = ["lua54", "vendored"] }

# Rhai embedded scripting language (pure Rust, no C deps).
rhai = "1.26"
